<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenPlate Menu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Just+Another+Hand&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <div class="header_inner">
            <div class="left_header">
                <button class="sigin" type="button">Sign In</button>
                <div class="cart">
                    <button class="cart_button" type="button" aria-label="Shopping cart">
                        <img src="img/Shopping bag.svg" alt="" class="cart_icon">
                        <span class="cart_count">0</span>
                    </button>
                </div>
            </div>
            <div class="logo_center">
                <a href="#home" aria-label="GreenPlate home">
                    <img class="logo" src="img/logo.svg" alt="GreenPlate">
                </a>
            </div>
            <nav class="navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#delivery">Delivery</a></li>
                    <li><a href="#reviews">Reviews</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
</body>
</html>
